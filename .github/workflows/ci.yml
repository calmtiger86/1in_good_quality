name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Lint + TypeScript ───────────────────────────
  lint-and-type-check:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

  # ─── Job 2: Unit Tests ──────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Jest unit tests
        run: npm test

  # ─── Job 3: Build (needs lint + test) ───────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test]
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Stub 값으로 빌드 — 실제 값은 Vercel 환경변수에 설정
          COUPANG_PARTNERS_ACCESS_KEY: ci-stub
          COUPANG_PARTNERS_SECRET_KEY: ci-stub
          IMAGE_GEN_API_KEY: ci-stub
          IMAGE_GEN_API_URL: https://stub.example.com
          NEXT_PUBLIC_APP_URL: https://stub.example.com
